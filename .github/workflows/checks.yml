name: Repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_fixtures.py
      - run: python scripts/check_repository.py
      - run: python -m compileall -q dwarf_violetto scripts tests
      - run: python scripts/report.py && git diff --exit-code -- BENCHMARKS.md results/summary.json

# Metal inference checks run manually on Apple Silicon. See README.md.
