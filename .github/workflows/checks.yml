name: Repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_fixtures.py
      - run: python scripts/check_repository.py
      - run: python -m compileall -q dwarf_violetto scripts tests
      - run: python scripts/report.py && git diff --exit-code -- BENCHMARKS.md results/summary.json

# Metal inference checks run manually on Apple Silicon. See README.md.
